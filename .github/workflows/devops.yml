name: Deploy Node.js App

on:
  push:
    branches:
      - main
      -qa
      -production
      
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/my-aws-cicd-project1
            git fetch origin
            git reset --hard origin/main
            npm install
            pm2 restart all|| pm2 start app.js --name "my-aws-cicd-project1"
            echo "Deployment completed!"
